name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q -o "$(ls *.zip | sort -V | tail -1)"
      - name: Build debug APK
        shell: bash
        working-directory: FabSteelARQC
        run: gradle assembleDebug --stacktrace 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -h "^e: " build.log | sed 's#file:///.*/arqc/##' | head -30 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: FabSteelARQC-debug-apk
          path: FabSteelARQC/app/build/outputs/apk/debug/app-debug.apk
