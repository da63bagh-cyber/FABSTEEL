name: Build Windows tool
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        shell: bash
        run: unzip -q -o "$(ls *.zip | sort -V | tail -1)"
      - name: Copy shared sources
        shell: bash
        run: cp FabSteelARQC/app/src/main/java/ir/fabsteel/arqc/{Ifc,FabQc,U3d,Qcar}.kt FabSteelARQC/desktop/src/main/kotlin/
      - name: Build jar
        shell: bash
        working-directory: FabSteelARQC/desktop
        run: gradle jar --stacktrace
      - name: Package exe
        shell: bash
        working-directory: FabSteelARQC/desktop
        run: jpackage --type app-image --name FabSteelQCAR --input build/libs --main-jar fabsteel-qcar.jar --main-class ir.fabsteel.arqc.MainKt --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: FabSteel-QCAR-Windows
          path: FabSteelARQC/desktop/dist/FabSteelQCAR
